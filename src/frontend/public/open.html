<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Открытие Kamizo</title>
<!--
  Страница-посредник между ботом и приложением.

  Зачем она вообще нужна. Telegram открывает ссылки в собственном
  встроенном браузере, а он не отдаёт систему по App Links и Universal
  Links — то есть обычная https-ссылка там всегда останется веб-версией,
  сколько привязку ни настраивай. Эта страница пробует передать
  управление приложению теми способами, которые из встроенного браузера
  работают.

  Android — надёжно: схема intent:// со встроенным запасным адресом.
  Приложение установлено — откроется оно, нет — Chrome сам уйдёт на
  browser_fallback_url. Никаких таймеров и догадок.

  iOS — как повезёт: надёжного аналога нет. Пробуем собственную схему и
  через полсекунды остаёмся на месте. Поэтому кнопки ниже — не
  украшение, а основной способ для iOS.

  Автоматика может не сработать в обоих случаях, и тогда человек должен
  видеть, что делать. Пустой экран с молчаливым редиректом — худшее, чем
  это могло закончиться.
-->
<style>
  :root {
    --bg: #f4f0e8;
    --card: #ffffff;
    --ink: #1c1a17;
    --muted: #6b6459;
    --brand: #2f6f4e;
    --line: #e4ddd0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16150f;
      --card: #201e18;
      --ink: #f2ede2;
      --muted: #a49b8a;
      --brand: #6fbf90;
      --line: #322e25;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 24px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  a.btn {
    display: block;
    padding: 14px 18px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }
  a.primary { background: var(--brand); color: #fff; margin-bottom: 10px; }
  a.secondary { border: 1px solid var(--line); color: var(--ink); }
  .hint { margin: 16px 0 0; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Открываем Kamizo</h1>
    <p id="status">Секунду…</p>
    <a class="btn primary" id="app" href="#">Открыть в приложении</a>
    <a class="btn secondary" id="web" href="/">Продолжить в браузере</a>
    <p class="hint" id="hint"></p>
  </div>

<script>
(function () {
  // Токен пробрасываем как есть и ничего о нём не знаем: он
  // непрозрачный, а проверяет его сервер — по JWT, сроку и доступу к
  // дому. Здесь он просто параметр, который надо донести до приложения.
  var params = new URLSearchParams(location.search);
  var token = params.get('telegramDraft') || '';
  var host = location.host;

  // Веб-версия того же тенанта: домен берём из адреса этой страницы, а
  // не зашиваем — ссылка бота ведёт на домен тенанта, и уводить
  // человека на app.kamizo.uz значило бы отправить его в чужой кабинет.
  var webUrl = location.protocol + '//' + host + '/' + (token ? '?telegramDraft=' + encodeURIComponent(token) : '');
  document.getElementById('web').href = webUrl;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
    // iPadOS 13+ представляется как Mac; отличаем по наличию тача.
    (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  var appUrl;
  if (isAndroid) {
    // browser_fallback_url обязателен: без него встроенный браузер при
    // отсутствии приложения покажет ошибку вместо веб-версии.
    appUrl = 'intent://' + host + '/' +
      (token ? '?telegramDraft=' + encodeURIComponent(token) : '') +
      '#Intent;scheme=https;package=uz.kamizo.app;' +
      'S.browser_fallback_url=' + encodeURIComponent(webUrl) + ';end';
  } else if (isIOS) {
    appUrl = 'kamizo://draft' + (token ? '?telegramDraft=' + encodeURIComponent(token) : '');
  }

  var statusEl = document.getElementById('status');
  var appEl = document.getElementById('app');
  var hintEl = document.getElementById('hint');

  if (!appUrl) {
    // Десктоп: приложения нет и быть не может — незачем делать вид.
    appEl.style.display = 'none';
    statusEl.textContent = 'Переходим к форме заявки.';
    location.replace(webUrl);
    return;
  }

  appEl.href = appUrl;
  hintEl.textContent = isIOS
    ? 'Если приложение не открылось, нажмите «Открыть в приложении».'
    : 'Если приложение не установлено, откроется браузер.';

  // Пробуем сразу — но только на Android, где промах безопасен:
  // intent:// с запасным адресом сам уведёт куда надо. На iOS
  // автопереход по несуществующей схеме даёт модальное окно с ошибкой
  // поверх страницы, и человек упирается в него раньше, чем увидит
  // кнопки. Поэтому там ждём осознанного нажатия.
  if (isAndroid) {
    statusEl.textContent = 'Открываем приложение…';
    location.href = appUrl;
    setTimeout(function () {
      statusEl.textContent = 'Приложение не открылось.';
    }, 1500);
  } else {
    statusEl.textContent = 'Выберите, где открыть заявку.';
  }
})();
</script>
</body>
</html>
