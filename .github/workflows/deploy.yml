name: Deploy to Cloudflare

env:
  PRODUCTION_URL: https://app.kamizo.uz
  STAGING_URL: https://kamizo-staging.workers.dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      backend_release_verified:
        description: Backend deployed and smoke-tested on VPS
        required: true
        type: boolean
        default: false
      staging_config_verified:
        description: Staging binding IDs and removed classes were manually verified
        required: true
        type: boolean
        default: false

jobs:
  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.backend_release_verified == true
    runs-on: ubuntu-latest
    name: Deploy to Production
    environment: production
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure read-only VPS preflight SSH
        env:
          KAMIZO_VPS_SSH_KEY: ${{ secrets.KAMIZO_VPS_SSH_KEY }}
          KAMIZO_VPS_KNOWN_HOSTS: ${{ secrets.KAMIZO_VPS_KNOWN_HOSTS }}
        run: |
          test -n "$KAMIZO_VPS_SSH_KEY"
          test -n "$KAMIZO_VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          # Секрет принимается в двух видах: как PEM и как base64 одной строкой.
          # Многострочный PEM легко портится копипастом с Windows (CRLF, потеря
          # переносов) — OpenSSH тогда падает с "error in libcrypto" ещё до
          # подключения. base64 одной строкой испортить нечем (инцидент 2026-08-20).
          if printf '%s' "$KAMIZO_VPS_SSH_KEY" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            printf '%s\n' "$KAMIZO_VPS_SSH_KEY" | tr -d '\r' >"$HOME/.ssh/kamizo_vps"
          else
            printf '%s' "$KAMIZO_VPS_SSH_KEY" | tr -d '\r\n \t' | base64 -d >"$HOME/.ssh/kamizo_vps"
          fi
          printf '%s\n' "$KAMIZO_VPS_KNOWN_HOSTS" | tr -d '\r' >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/kamizo_vps" "$HOME/.ssh/known_hosts"
          # Ранняя проверка формата: иначе ошибка всплывёт как Permission denied.
          ssh-keygen -y -f "$HOME/.ssh/kamizo_vps" >/dev/null

      - name: Verify production backend ingress security
        run: ./scripts/preflight-backend-production.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Reproducible install from the committed lockfile.
      - name: Install frontend dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd src/frontend
          npm run test

      - name: Type-check frontend
        run: |
          cd src/frontend
          npm run typecheck

      - name: Build frontend
        run: |
          cd src/frontend
          npm run build:budget

      - name: Install Cloudflare dependencies
        run: |
          cd cloudflare
          npm ci

      - name: Type-check backend
        run: |
          cd cloudflare
          npx tsc --noEmit

      - name: Run backend tests
        run: |
          cd cloudflare
          npm run test

      - name: Install Playwright Chromium
        run: |
          cd src/frontend
          npx playwright install --with-deps chromium

      - name: Run isolated E2E without production access
        run: |
          cd src/frontend
          npm run test:e2e:isolated

      - name: Copy built files to cloudflare/public
        run: |
          rm -rf cloudflare/public
          cp -r src/frontend/dist cloudflare/public

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: deploy

      - name: Verify production frontend bundle
        run: ./scripts/verify-frontend-bundle.sh "$PRODUCTION_URL"

      - name: Deployment summary
        run: |
          echo "✅ Production deployment successful!"
          echo "🌐 Live at: $PRODUCTION_URL"

  develop-checks:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    name: Develop Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd src/frontend
          npm run test

      - name: Type-check frontend
        run: |
          cd src/frontend
          npm run typecheck

      - name: Build frontend
        run: |
          cd src/frontend
          npm run build:budget

      - name: Install Playwright Chromium
        run: |
          cd src/frontend
          npx playwright install --with-deps chromium

      - name: Run isolated E2E without production access
        run: |
          cd src/frontend
          npm run test:e2e:isolated

      - name: Install Cloudflare dependencies
        run: |
          cd cloudflare
          npm ci

      - name: Type-check backend
        run: |
          cd cloudflare
          npx tsc --noEmit

      - name: Run backend tests
        run: |
          cd cloudflare
          npm run test

      - name: Upload verified frontend build
        uses: actions/upload-artifact@v4
        with:
          name: staging-frontend-dist
          path: src/frontend/dist/
          if-no-files-found: error
          retention-days: 1

  deploy-staging:
    needs: develop-checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/develop' &&
      inputs.staging_config_verified == true
    runs-on: ubuntu-latest
    name: Deploy to Staging
    timeout-minutes: 90
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download verified frontend build
        uses: actions/download-artifact@v4
        with:
          name: staging-frontend-dist
          path: cloudflare/public

      - name: Install Cloudflare dependencies
        run: |
          cd cloudflare
          npm ci

      - name: Preflight staging bindings and removed classes
        run: ./scripts/preflight-staging-config.sh cloudflare/wrangler.staging.toml

      - name: Deploy to Cloudflare Workers (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: deploy --config wrangler.staging.toml

      - name: Verify staging frontend bundle
        run: ./scripts/verify-frontend-bundle.sh "$STAGING_URL"

      - name: Deployment summary
        run: |
          echo "✅ Staging deployment successful!"
          echo "🌐 Staging at: $STAGING_URL"
